{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Matheus Batista, Desenvolvedor Full Stack. Solucoes digitais com foco em produto, tecnologia e experiencia.">
    <title>{% block title %}Matheus Batista{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/sections/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/sections/services.css' %}">
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% include "partials/navbar.html" %}

    <main>
      {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
